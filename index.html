<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NimbleBible</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Fast, frictionless Bible navigation">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NimbleBible">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#121212">
    <meta name="msapplication-TileImage" content="/icons/icon-192.png">
    <meta name="msapplication-config" content="none">
</head>

<body>
    <div id="app" data-current-view="homeView">
        <div id="home-view" class="view active">
            <div class="header">
                <button class="back-btn" style="visibility: hidden;">←</button>
                <h1>NimbleBible</h1>
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                        <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="home-content">
                <button id="btn-ot" class="big-btn" data-testament="Old Testament">Old Testament</button>
                <button id="btn-nt" class="big-btn" data-testament="New Testament">New Testament</button>
            </div>
        </div>

        <div id="book-view" class="view hidden">
            <div class="header">
                <button class="back-btn">←</button>
                <h1 id="testament-title">Testament</h1>
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                        <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div id="book-list" class="grid-list"></div>
        </div>

        <div id="chapter-view" class="view hidden">
            <div class="header">
                <button class="back-btn">←</button>
                <h1 id="book-title">Book</h1>
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                        <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div id="chapter-list" class="grid-list"></div>
        </div>

        <div id="verse-list-view" class="view hidden">
            <div class="header">
                <button class="back-btn">←</button>
                <h1 id="verse-list-title">Chapter</h1>
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                        <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div id="verse-list" class="grid-list"></div>
        </div>

        <div id="verse-view" class="view hidden">
            <div class="header">
                <button class="back-btn">←</button>
                <h1 id="chapter-title">Chapter</h1>
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2" />
                        <line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div id="verse-content"></div>
        </div>

        <!-- Search Modal -->
        <div id="search-modal" class="search-modal hidden">
            <div class="search-dismiss-container">
                <button id="search-dismiss-btn" class="search-dismiss-btn">Dismiss</button>
            </div>
            <div class="search-header">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="Search the Bible..." autocomplete="off">
                    <button id="search-clear-btn" class="search-clear-btn">✕</button>
                </div>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>

        <!-- Unified Bottom Toolbar (minimized by default) -->
        <div id="audio-toolbar" class="audio-toolbar minimized">
            <!-- Expand/Collapse Toggle -->
            <button id="toolbar-toggle-btn" class="toolbar-toggle-btn" aria-label="Expand toolbar">
                <span class="toggle-arrow">^</span>
            </button>

            <!-- Toolbar Content (hidden when minimized) -->
            <div class="toolbar-content">
                <!-- Audio Play/Pause -->
                <button id="audio-play-btn" class="toolbar-btn audio-btn" aria-label="Play/Pause">
                    <svg class="play-icon" viewBox="0 0 24 24" width="20" height="20">
                        <polygon points="5,3 19,12 5,21" fill="currentColor" />
                    </svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
                        <rect x="5" y="3" width="4" height="18" fill="currentColor" />
                        <rect x="15" y="3" width="4" height="18" fill="currentColor" />
                    </svg>
                </button>

                <!-- Audio Scrubber -->
                <div class="audio-scrubber">
                    <div class="scrubber-track">
                        <div class="scrubber-progress" id="scrubber-progress"></div>
                        <input type="range" id="audio-range" min="0" max="100" value="0" step="1">
                    </div>
                    <span class="audio-time" id="audio-time">Verse 1 of 1</span>
                </div>

                <!-- Save Highlighted Verses -->
                <button id="save-collection-btn" class="toolbar-btn save-collection-btn" aria-label="Save to collection" title="Save highlighted verses to a collection" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
                <!-- Copy Button -->
                <button id="copy-verse-btn" class="toolbar-btn copy-btn disabled" aria-label="Copy selected verses">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor"
                            stroke-width="2" />
                        <path d="M5 15V5a2 2 0 012-2h10" fill="none" stroke="currentColor" stroke-width="2" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Tabs Bar -->
        <div id="tabs-bar" class="tabs-bar">
            <button id="tab-options-btn" class="tab-options-btn" aria-label="Tab Options">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <circle cx="5" cy="12" r="2" fill="currentColor" />
                    <circle cx="12" cy="12" r="2" fill="currentColor" />
                    <circle cx="19" cy="12" r="2" fill="currentColor" />
                </svg>
            </button>
            <div id="tabs-container" class="tabs-container"></div>
            <button id="new-tab-btn" class="new-tab-btn" aria-label="New tab">+</button>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>

</html>
